name: Build Windows game

# A Windows build of the game, made with PyInstaller (tools/build_desktop.py):
# a folder with DragonBallZTrunksHope.exe and the game's files, zipped.
#
#   assets   downloads the sprite sheets (setup.sh, on Linux)
#   build    on Windows: runs the tests, builds the game, starts it once in
#            smoke-test mode (a short fight, then it quits by itself), zips it
#   release  on a v* tag, attaches the zip (and the lobby server of this
#            version) to the GitHub release
#
# Run it by hand on any branch: Actions > this workflow > Run workflow.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download sprite sheets
        run: ./setup.sh
        env:
          # A token that can read the private dbz-assets repository
          GH_TOKEN: ${{ secrets.DBZ_ASSETS_TOKEN }}

      - name: Keep them for the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: sprite-sheets
          path: Graphics/assets/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    needs: assets
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get the sprite sheets
        uses: actions/download-artifact@v4
        with:
          name: sprite-sheets
          path: Graphics/assets/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the game's requirements and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      # On failure, tools/ci_annotate.py shows why on the run's summary page
      - name: Run the tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests > tests.log 2>&1
          status=$?
          cat tests.log
          [ $status -eq 0 ] || python tools/ci_annotate.py tests tests.log
          exit $status
        env:
          PYTHONPATH: src
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONIOENCODING: utf-8

      - name: Build the game
        shell: bash
        run: |
          python tools/build_desktop.py > build.log 2>&1 || { cat build.log; python tools/ci_annotate.py tail build.log "PyInstaller build failed"; exit 1; }
          tail -5 build.log

      - name: Start it once (smoke test)
        shell: pwsh
        env:
          DBZ_SMOKE_TEST: arcade
          DBZ_SMOKE_TEST_SECONDS: "5"
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          $game = Start-Process -FilePath "dist\DragonBallZTrunksHope\DragonBallZTrunksHope.exe" -PassThru
          if (-not $game.WaitForExit(120000)) {
            Stop-Process -Id $game.Id -Force
            throw "The game did not quit by itself"
          }
          if ($game.ExitCode -ne 0) { throw "The game failed (exit code $($game.ExitCode))" }
          Write-Host "The game started, played a fight and quit"

      - name: Zip it
        shell: pwsh
        run: |
          $version = (Select-String -Path src\version.py -Pattern '__version__ = "(.*)"').Matches[0].Groups[1].Value
          Compress-Archive -Path dist\DragonBallZTrunksHope -DestinationPath "DragonBallZTrunksHope-v$version-windows.zip"

      - name: Upload the game
        uses: actions/upload-artifact@v4
        with:
          name: windows-game
          path: DragonBallZTrunksHope-*-windows.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the game
        uses: actions/download-artifact@v4
        with:
          name: windows-game
          path: dist/

      # The online lobby server of this version, one file (Python 3.8+)
      - name: Add the lobby server
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'src'); import version; print(version.__version__)")
          cp server/lobby_server.py "dist/lobby_server-v${version}.py"

      - name: Attach them to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/lobby_server-*.py
          generate_release_notes: true
